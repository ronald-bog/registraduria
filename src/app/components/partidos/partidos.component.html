<div id="listados">
  <div class="row justify-content-center">
    <div class="d-grid gap-2 col-3 mx-auto">
      <button class="btn btn-outline-success" type="button" (click)="agregar()">Crear Partido</button>
    </div>
    <div class="col-9">
      <H1>LISTADO DE PARTIDOS</H1>
    </div>
    <div class="col">
    </div>
  </div>
  <table class="table table-hover table-sm align-middle text-center">
    <thead class="table-dark">
      <tr>
        <th scope="col">Nombre Partido</th>
        <th scope="col">Lema</th>
        <th scope="col">EDITAR</th>
        <th scope="col">ELIMINAR</th>
      </tr>
    </thead>
    <tbody *ngFor="let partidoActual of partidos">
      <tr>
        <td>{{ partidoActual.nombre}}</td>
        <td>{{ partidoActual.lema }}</td>
        <td>
          <button type="button" class="btn btn-primary btn-sm" (click)="editar(partidoActual._id!)">
            <i class="fa-regular fa-pen-to-square" style="font-size: 20px"></i>
          </button>
        </td>
        <td>
          <button type="button" class="btn btn-danger btn-sm" (click)="eliminar(partidoActual._id!)">
            <i class="fa-regular fa-trash-can" style="font-size: 20px"></i>
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
