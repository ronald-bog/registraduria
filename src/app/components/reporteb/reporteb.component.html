<div class="container">
  <div class="justify-content-center">
    <H1>MESAS CON MAYOR VOTACION</H1>
  </div>
  <div class="row">
    <div class="col-3">
      <div id="listados">
        <table class="table table-hover table-sm align-middle text-center">
          <thead class="table-dark">
            <tr>
              <th scope="col">Mesa</th>
              <th scope="col">Votos</th>
            </tr>
          </thead>
          <tbody *ngFor="let item of reporteb">
            <tr>
              <td>{{ item.name }}</td>
              <td>{{ item.value }}</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
    <div class="col-9">
      <ngx-charts-advanced-pie-chart [view]="view" scheme="vivid" [results]="reporteb" [gradient]="gradient"
        (select)="onSelect($event)" (activate)="onActivate($event)" (deactivate)="onDeactivate($event)">
      </ngx-charts-advanced-pie-chart>
    </div>
  </div>
</div>
