<div id="listados">
  <div class="row justify-content-center">
    <div class="d-grid gap-2 col-3 mx-auto">
      <button class="btn btn-outline-success" type="button" (click)="agregar()">Registrar Resultado</button>
    </div>
    <div class="col-9">
      <H1>LISTADO DE RESULTADOS</H1>
    </div>
    <div class="col">
    </div>
  </div>
  <table class="table table-hover table-sm align-middle text-center">
    <thead class="table-dark">
      <tr>
        <th scope="col">Mesa</th>
        <th scope="col">Candidato</th>
        <th scope="col">Partido</th>
        <th scope="col">Votos</th>
        <th scope="col">ELIMINAR</th>
      </tr>
    </thead>
    <tbody *ngFor="let resultadoActual of resultados">
      <tr>
        <td>{{ resultadoActual.mesa}}</td>
        <td>{{ resultadoActual.candidato }}</td>
        <td>{{ resultadoActual.partido }}</td>
        <td>{{ resultadoActual.votos }}</td>
        <td>
          <button type="button" class="btn btn-danger btn-sm" (click)="eliminar(resultadoActual._id!)">
            <i class="fa-regular fa-trash-can" style="font-size: 20px"></i>
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
