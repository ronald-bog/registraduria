<div
  class="modal fade"
  id="partidoscrModal"
  tabindex="-1"
  aria-labelledby="exampleModalLabel"
  aria-hidden="true"
  data-bs-backdrop="static"
>
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h1 *ngIf="modoCreacion" class="modal-title fs-5" id="exampleModalLabel">CREACION DE PARTIDO</h1>
        <h1 *ngIf="!modoCreacion" class="modal-title fs-5" id="exampleModalLabel">MODIFICACION DE PARTIDO</h1>
        <button
          type="button"
          class="btn-close"
          (click)="regreso()"
          data-bs-dismiss="modal"
          aria-label="Close"
        ></button>
      </div>
      <div class="modal-body">
        <div class="row">
          <div class="col-3">
            <label>Nombre</label>
          </div>
          <div class="col-9">
            <input
              class="form-control"
              type="text"
              [disabled]="!modoCreacion"
              [(ngModel)]="partido.nombre"
            />
            <p *ngIf="intentoEnvio && partido.nombre == ''">Requerido</p>
          </div>
        </div>
        <br />
        <div class="row">
          <div class="col-3">
            <label>Lema</label>
          </div>
          <div class="col-9">
            <input
              class="form-control"
              type="text"
              [(ngModel)]="partido.lema"
            />
            <p *ngIf="intentoEnvio && partido.lema == ''">Requerido</p>
          </div>
        </div>
        <br />
        <br />
      </div>
      <div class="modal-footer">
        <button
          type="button"
          class="btn btn-secondary"
          data-bs-dismiss="modal"
          (click)="regreso()"
        >
          Regresar
        </button>
        <button
          *ngIf="modoCreacion"
          class="btn btn-primary btn-block"
          data-bs-dismiss="modal"
          (click)="agregar()"
        >
          Crear
        </button>
        <button
          *ngIf="!modoCreacion"
          class="btn btn-primary btn-block"
          data-bs-dismiss="modal"
          (click)="editar()"
        >
          Actualizar
        </button>
      </div>
    </div>
  </div>
</div>
